<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby — Huddle</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .lobby-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .lobby-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      align-items: start;
    }

    .preview-card {
      background-color: #141416;
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-lg);
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror preview */
    }

    .preview-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #A1A1AA;
    }

    .avatar-large {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #27272A;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-controls-overlay {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background-color: rgba(20, 20, 22, 0.75);
      padding: 8px 14px;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(8px);
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: var(--border-width) solid rgba(255, 255, 255, 0.15);
      background-color: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--transition-fast), border-color var(--transition-fast);
    }

    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .control-btn.btn-muted {
      background-color: var(--danger);
      border-color: var(--danger);
    }

    .lobby-info-card {
      background-color: var(--bg-surface);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
    }

    .room-header-title {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .mic-meter-wrapper {
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .meter-label-row {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background-color: var(--bg-surface-subtle);
      border-radius: 3px;
      overflow: hidden;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      background-color: var(--success);
      transition: width 60ms ease-out;
    }

    .permission-banner {
      background-color: var(--accent-subtle);
      border: var(--border-width) solid var(--accent);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: var(--font-size-meta);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .lobby-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-mark">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" />
        <rect x="3" y="6" width="12" height="12" rx="2" />
      </svg>
      <span>Huddle</span>
    </div>

    <div class="user-profile">
      <a href="/dashboard" class="btn btn-secondary" style="padding: 4px 12px; font-size: var(--font-size-meta);">Exit to Dashboard</a>
    </div>
  </header>

  <main class="lobby-container">
    <div id="permission-warning" class="permission-banner" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div id="permission-text">Camera and microphone access are required for full participation. You may still join with media disabled.</div>
    </div>

    <div class="lobby-grid">
      <!-- Media Preview -->
      <div>
        <div class="preview-card">
          <video id="preview-video" autoplay playsinline muted></video>
          
          <div class="preview-placeholder" id="preview-avatar" style="display: none;">
            <div class="avatar-large" id="avatar-initials">--</div>
            <span id="avatar-name">Camera is off</span>
          </div>

          <div class="preview-controls-overlay">
            <button id="btn-toggle-mic" class="control-btn" aria-label="Toggle microphone" title="Toggle microphone">
              <svg id="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <button id="btn-toggle-cam" class="control-btn" aria-label="Toggle camera" title="Toggle camera">
              <svg id="icon-cam" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mic Volume Meter -->
        <div class="mic-meter-wrapper">
          <div class="meter-label-row">
            <span>Microphone Level</span>
            <span id="mic-status-text">Detecting voice...</span>
          </div>
          <div class="meter-track">
            <div id="mic-meter-fill" class="meter-fill"></div>
          </div>
        </div>
      </div>

      <!-- Room Info & Join Options -->
      <div class="lobby-info-card">
        <h1 class="room-header-title" id="room-title">Meeting Room</h1>
        <p class="text-meta" style="margin-bottom: 20px;">
          Room Code: <span id="room-code-badge" style="font-family: monospace; font-weight: 600;">hud-xxx-xxx</span>
        </p>

        <!-- Passcode if required -->
        <div class="form-group" id="group-passcode" style="display: none;">
          <label for="input-passcode">Room Passcode</label>
          <input type="password" id="input-passcode" placeholder="Enter room passcode">
          <div class="error-message" id="error-passcode" style="display: none;"></div>
        </div>

        <!-- Device Selections -->
        <div class="form-group">
          <label for="select-camera">Camera</label>
          <select id="select-camera">
            <option value="">Default Camera</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-mic">Microphone</label>
          <select id="select-mic">
            <option value="">Default Microphone</option>
          </select>
        </div>

        <div class="form-group" id="group-speaker" style="display: none;">
          <label for="select-speaker">Speaker</label>
          <select id="select-speaker">
            <option value="">Default Speaker</option>
          </select>
        </div>

        <div class="error-message" id="error-general" style="display: none; margin-bottom: 12px;"></div>

        <button id="btn-join" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px 16px;">
          <span>Join Meeting</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { api } from '/js/api.js';

    const roomCode = window.location.pathname.split('/').pop().trim();
    let localStream = null;
    let audioContext = null;
    let analyser = null;
    let animationFrameId = null;

    let isAudioEnabled = true;
    let isVideoEnabled = true;
    let roomInfo = null;

    const previewVideo = document.getElementById('preview-video');
    const previewAvatar = document.getElementById('preview-avatar');
    const avatarInitials = document.getElementById('avatar-initials');
    const btnToggleMic = document.getElementById('btn-toggle-mic');
    const btnToggleCam = document.getElementById('btn-toggle-cam');
    const selectCam = document.getElementById('select-camera');
    const selectMic = document.getElementById('select-mic');
    const selectSpeaker = document.getElementById('select-speaker');
    const groupSpeaker = document.getElementById('group-speaker');
    const micMeterFill = document.getElementById('mic-meter-fill');
    const micStatusText = document.getElementById('mic-status-text');
    const btnJoin = document.getElementById('btn-join');
    const groupPasscode = document.getElementById('group-passcode');
    const inputPasscode = document.getElementById('input-passcode');
    const errorPasscode = document.getElementById('error-passcode');
    const errorGeneral = document.getElementById('error-general');
    const permissionWarning = document.getElementById('permission-warning');

    // Retrieve saved room passcode from sessionStorage if creator set one
    const savedPasscode = sessionStorage.getItem(`huddle_passcode_${roomCode}`);
    if (savedPasscode) {
      inputPasscode.value = savedPasscode;
    }

    async function init() {
      try {
        // Verify current user
        const me = await api.getMe();
        if (!me.user) {
          window.location.href = `/?redirect=${encodeURIComponent(window.location.pathname)}`;
          return;
        }

        const initials = me.user.displayName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        avatarInitials.textContent = initials;

        // Fetch room info
        roomInfo = await api.get(`/api/rooms/${encodeURIComponent(roomCode)}`);
        document.getElementById('room-title').textContent = roomInfo.title || 'Meeting Room';
        document.getElementById('room-code-badge').textContent = roomInfo.code;

        if (roomInfo.requiresPasscode) {
          groupPasscode.style.display = 'block';
        }

        // Initialize user media
        await setupMedia();
        await enumerateDevices();
      } catch (err) {
        if (err.status === 404) {
          window.location.href = '/404.html';
        } else if (err.status === 410) {
          errorGeneral.textContent = 'This meeting has ended.';
          errorGeneral.style.display = 'block';
          btnJoin.disabled = true;
        } else if (err.status === 423) {
          errorGeneral.textContent = 'This meeting is locked by the host.';
          errorGeneral.style.display = 'block';
          btnJoin.disabled = true;
        } else {
          errorGeneral.textContent = err.message || 'Failed to initialize lobby.';
          errorGeneral.style.display = 'block';
        }
      }
    }

    async function setupMedia(videoSource = null, audioSource = null) {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        video: videoSource ? { deviceId: { exact: videoSource } } : true,
        audio: audioSource ? { deviceId: { exact: audioSource } } : true
      };

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        previewVideo.srcObject = localStream;
        previewVideo.style.display = 'block';
        previewAvatar.style.display = 'none';

        // Setup audio analyser for mic meter
        setupAudioAnalyser(localStream);
      } catch (err) {
        console.warn('Media access error in lobby:', err);
        permissionWarning.style.display = 'flex';
        previewVideo.style.display = 'none';
        previewAvatar.style.display = 'flex';
        isVideoEnabled = false;
        isAudioEnabled = false;
        updateMediaUI();
      }
    }

    function setupAudioAnalyser(stream) {
      if (audioContext) {
        audioContext.close();
      }
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioContext = new AudioCtx();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateMeter() {
          if (!isAudioEnabled) {
            micMeterFill.style.width = '0%';
            micStatusText.textContent = 'Microphone muted';
            animationFrameId = requestAnimationFrame(updateMeter);
            return;
          }

          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const avg = sum / dataArray.length;
          const percent = Math.min(100, Math.round((avg / 128) * 100));
          micMeterFill.style.width = `${percent}%`;
          micStatusText.textContent = percent > 5 ? 'Active' : 'Silent';

          animationFrameId = requestAnimationFrame(updateMeter);
        }

        updateMeter();
      } catch (e) {
        console.warn('AudioContext not available:', e);
      }
    }

    async function enumerateDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        
        selectCam.innerHTML = '<option value="">Default Camera</option>';
        selectMic.innerHTML = '<option value="">Default Microphone</option>';
        selectSpeaker.innerHTML = '<option value="">Default Speaker</option>';

        let camCount = 0;
        let micCount = 0;
        let spkCount = 0;

        devices.forEach(device => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          if (device.kind === 'videoinput') {
            camCount++;
            opt.textContent = device.label || `Camera ${camCount}`;
            selectCam.appendChild(opt);
          } else if (device.kind === 'audioinput') {
            micCount++;
            opt.textContent = device.label || `Microphone ${micCount}`;
            selectMic.appendChild(opt);
          } else if (device.kind === 'audiooutput') {
            spkCount++;
            opt.textContent = device.label || `Speaker ${spkCount}`;
            selectSpeaker.appendChild(opt);
          }
        });

        if ('setSinkId' in HTMLMediaElement.prototype && spkCount > 0) {
          groupSpeaker.style.display = 'block';
        }
      } catch (err) {
        console.warn('Device enumeration error:', err);
      }
    }

    selectCam.addEventListener('change', () => {
      setupMedia(selectCam.value, selectMic.value);
    });

    selectMic.addEventListener('change', () => {
      setupMedia(selectCam.value, selectMic.value);
    });

    // Toggle Mic
    btnToggleMic.addEventListener('click', () => {
      isAudioEnabled = !isAudioEnabled;
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = isAudioEnabled);
      }
      updateMediaUI();
    });

    // Toggle Cam
    btnToggleCam.addEventListener('click', () => {
      isVideoEnabled = !isVideoEnabled;
      if (localStream) {
        localStream.getVideoTracks().forEach(t => t.enabled = isVideoEnabled);
      }
      previewVideo.style.display = isVideoEnabled ? 'block' : 'none';
      previewAvatar.style.display = isVideoEnabled ? 'none' : 'flex';
      updateMediaUI();
    });

    function updateMediaUI() {
      if (isAudioEnabled) {
        btnToggleMic.classList.remove('btn-muted');
      } else {
        btnToggleMic.classList.add('btn-muted');
      }

      if (isVideoEnabled) {
        btnToggleCam.classList.remove('btn-muted');
      } else {
        btnToggleCam.classList.add('btn-muted');
      }
    }

    // Join Action
    btnJoin.addEventListener('click', async () => {
      errorPasscode.style.display = 'none';
      errorGeneral.style.display = 'none';

      const passcode = inputPasscode.value.trim();

      if (roomInfo?.requiresPasscode) {
        if (!passcode) {
          errorPasscode.textContent = 'Room passcode is required to enter.';
          errorPasscode.style.display = 'block';
          inputPasscode.focus();
          return;
        }

        // Verify passcode
        try {
          btnJoin.disabled = true;
          btnJoin.textContent = 'Verifying...';
          await api.post(`/api/rooms/${encodeURIComponent(roomCode)}/verify-passcode`, { passcode });
        } catch (err) {
          btnJoin.disabled = false;
          btnJoin.textContent = 'Join Meeting';
          errorPasscode.textContent = err.message || 'Incorrect passcode.';
          errorPasscode.style.display = 'block';
          return;
        }
      }

      // Save preferences to sessionStorage for room.html
      sessionStorage.setItem('huddle_pref_audio', isAudioEnabled ? '1' : '0');
      sessionStorage.setItem('huddle_pref_video', isVideoEnabled ? '1' : '0');
      if (passcode) {
        sessionStorage.setItem(`huddle_passcode_${roomCode}`, passcode);
      }
      if (selectCam.value) sessionStorage.setItem('huddle_pref_cam', selectCam.value);
      if (selectMic.value) sessionStorage.setItem('huddle_pref_mic', selectMic.value);

      // Clean up lobby stream before transitioning
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }

      window.location.href = `/room/${encodeURIComponent(roomCode)}`;
    });

    init();
  </script>
</body>
</html>
