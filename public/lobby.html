<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby — Huddle</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .lobby-wrapper {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 var(--space-6);
    }

    .lobby-layout {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: var(--space-8);
      align-items: center;
    }

    /* Video Preview Card */
    .preview-card-wrapper {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .preview-card {
      background-color: #0F0F11;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
    }

    #preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .preview-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      color: #A1A1AA;
    }

    .avatar-large {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-full);
      background-color: #2563EB;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: var(--font-bold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .preview-name-chip {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background-color: rgba(15, 15, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      font-weight: var(--font-medium);
      color: #FAFAFA;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .preview-controls-overlay {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      gap: var(--space-2);
      z-index: 10;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px);
      color: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .control-btn:hover {
      background-color: rgba(39, 39, 42, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.04);
    }

    .control-btn.btn-muted {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #FFFFFF;
    }

    /* Microphone meter */
    .mic-meter-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      box-shadow: var(--shadow-xs);
    }

    .meter-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background-color: var(--bg-surface-subtle);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      background-color: var(--success);
      border-radius: var(--radius-full);
      transition: width 60ms ease-out;
    }

    /* Right Settings Card */
    .lobby-info-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-sm);
    }

    .room-header-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-bold);
      margin-bottom: var(--space-1);
    }

    .room-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background-color: var(--bg-surface-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-family-mono);
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-bottom: var(--space-6);
    }

    .permission-banner {
      background-color: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-6);
      font-size: var(--font-size-sm);
      color: var(--accent-text);
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }

    @media (max-width: 840px) {
      .lobby-layout {
        grid-template-columns: 1fr;
      }
      .lobby-wrapper {
        margin: 20px auto;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-mark">
      <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#2563EB"/>
        <rect x="7" y="10" width="12" height="12" rx="3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 14.2L24.2 11.1C24.7 10.8 25.3 11.2 25.3 11.8V20.2C25.3 20.8 24.7 21.2 24.2 20.9L19 17.8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Huddle</span>
    </div>

    <div class="user-profile">
      <a href="/dashboard" class="btn btn-secondary btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Dashboard
      </a>
    </div>
  </header>

  <main class="lobby-wrapper">
    <div id="permission-warning" class="permission-banner" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div id="permission-text">Camera and microphone access are required for full participation. You may still join with media disabled.</div>
    </div>

    <div class="lobby-layout">
      <!-- Media Preview Column -->
      <div class="preview-card-wrapper">
        <div class="preview-card">
          <video id="preview-video" autoplay playsinline muted></video>
          
          <div class="preview-placeholder" id="preview-avatar" style="display: none;">
            <div class="avatar-large" id="avatar-initials">--</div>
            <span id="avatar-name" style="font-size: var(--font-size-sm); font-weight: 500;">Camera is off</span>
          </div>

          <div class="preview-name-chip" id="lobby-user-chip">Ready to join</div>

          <div class="preview-controls-overlay">
            <button id="btn-toggle-mic" class="control-btn" aria-label="Toggle microphone" title="Toggle microphone">
              <svg id="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <button id="btn-toggle-cam" class="control-btn" aria-label="Toggle camera" title="Toggle camera">
              <svg id="icon-cam" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mic Volume Meter -->
        <div class="mic-meter-box">
          <div class="meter-label-row">
            <span style="font-weight: 500;">Microphone</span>
            <span id="mic-status-text">Detecting voice...</span>
          </div>
          <div class="meter-track">
            <div id="mic-meter-fill" class="meter-fill"></div>
          </div>
        </div>
      </div>

      <!-- Room Info & Join Options -->
      <div class="lobby-info-card">
        <h1 class="room-header-title" id="room-title">Meeting Room</h1>
        <div class="room-code-badge">
          <span>Code:</span>
          <span id="room-code-badge" style="color: var(--text-primary); font-weight: 600;">hud-xxx-xxx</span>
        </div>

        <!-- Passcode if required -->
        <div class="form-group" id="group-passcode" style="display: none;">
          <label for="input-passcode">Room Passcode</label>
          <input type="password" id="input-passcode" placeholder="Enter room passcode">
          <div class="error-message" id="error-passcode" style="display: none;"></div>
        </div>

        <!-- Device Selections -->
        <div class="form-group">
          <label for="select-camera">Camera</label>
          <select id="select-camera">
            <option value="">Default Camera</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-mic">Microphone</label>
          <select id="select-mic">
            <option value="">Default Microphone</option>
          </select>
        </div>

        <div class="form-group" id="group-speaker" style="display: none;">
          <label for="select-speaker">Speaker</label>
          <select id="select-speaker">
            <option value="">Default Speaker</option>
          </select>
        </div>

        <div class="error-message" id="error-general" style="display: none; margin-bottom: 12px;"></div>

        <button id="btn-join" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-4);">
          <span>Join Meeting</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="/js/lobby-app.js"></script>
</body>
</html>
