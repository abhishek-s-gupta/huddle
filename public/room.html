<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Room — Huddle</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/room.css">
  <link rel="stylesheet" href="/css/whiteboard.css">
</head>
<body class="in-call" data-theme="dark">
  <!-- Call Header Bar -->
  <header class="call-header">
    <div class="call-title-area">
      <div class="brand-mark" style="font-size: 16px;">
        <svg class="brand-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" />
          <rect x="3" y="6" width="12" height="12" rx="2" />
        </svg>
        <span id="call-room-title">Meeting</span>
      </div>
      <span class="room-badge" id="call-room-code">hud-xxx-xxx</span>
      <div class="security-indicator" id="e2ee-status" title="WebRTC DTLS-SRTP media & AES-256-GCM encrypted chat">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>E2EE Encrypted</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <button id="btn-copy-link" class="btn btn-secondary" style="padding: 4px 10px; font-size: var(--font-size-meta); background-color: #1E1E22; border-color: #2F2F35; color: #F4F4F5;" title="Copy shareable meeting link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Copy Invite</span>
      </button>
      <div class="text-meta" id="participant-count-badge" style="color: #A1A1AA;">1 participant</div>
    </div>
  </header>

  <!-- Main Call Stage -->
  <main class="call-main">
    <div class="stage-area" id="stage-area">
      <!-- Screen Sharing Active Banner -->
      <div id="sharing-banner" class="sharing-banner" style="display: none;">
        <span>You are sharing your screen</span>
        <button id="btn-stop-sharing-banner" class="btn btn-danger" style="padding: 2px 8px; font-size: var(--font-size-xs);">Stop Sharing</button>
      </div>

      <!-- Remote / Local Screen Share Stage View -->
      <div id="screen-share-stage" class="screen-share-stage" style="display: none;">
        <video id="screen-share-video" autoplay playsinline></video>
      </div>

      <!-- Pinned Participant Stage View -->
      <div id="pinned-stage" class="pinned-container" style="display: none;">
        <video id="pinned-video" autoplay playsinline></video>
        <div class="tile-meta-bar">
          <span class="tile-name-tag" id="pinned-name-tag">Pinned User</span>
          <button class="tile-icon-btn" id="btn-unpin" title="Unpin participant">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Adaptive Video Grid -->
      <div class="video-grid" id="video-grid" data-count="1">
        <!-- Local User Video Tile -->
        <div class="video-tile local-tile" id="tile-local">
          <video id="video-local" autoplay playsinline muted></video>
          <div class="tile-avatar" id="avatar-local" style="display: none;">--</div>
          
          <div class="tile-meta-bar">
            <span class="tile-name-tag">
              <span id="name-local">You</span>
              <svg id="mic-icon-local" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </span>

            <div class="tile-actions">
              <span id="badge-hand-local" class="badge-hand" style="display: none;" title="Hand Raised">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                  <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
                  <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
                  <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <!-- Remote tiles appended dynamically here -->
      </div>
    </div>

    <!-- Collaborative Whiteboard Full Stage Overlay -->
    <div id="whiteboard-stage" class="whiteboard-stage" style="display: none;">
      <div class="whiteboard-topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-weight: 600; font-size: var(--font-size-body); color: #111111;">Collaborative Whiteboard</span>
          <span id="wb-zoom-level" class="zoom-badge">100%</span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="wb-btn-zoom-in" class="wb-tool-btn" title="Zoom In">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </button>
          <button id="wb-btn-zoom-out" class="wb-tool-btn" title="Zoom Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </button>
          <button id="wb-btn-zoom-reset" class="wb-tool-btn" title="Reset Zoom">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          </button>
          <button id="wb-btn-undo" class="wb-tool-btn" title="Undo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
          </button>
          <button id="wb-btn-redo" class="wb-tool-btn" title="Redo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
          </button>
          <button id="wb-btn-export" class="wb-tool-btn" title="Export as PNG">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </button>
          <button id="wb-btn-clear" class="btn btn-secondary" style="padding: 4px 10px; font-size: var(--font-size-meta); color: var(--danger);">Clear</button>
          <button id="wb-btn-close" class="wb-tool-btn" title="Close Whiteboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Tools Dock -->
      <div class="whiteboard-tools-dock">
        <button class="wb-tool-btn active" data-tool="pen" title="Pen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
        </button>
        <button class="wb-tool-btn" data-tool="highlighter" title="Highlighter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h3l6-6"></path><path d="M22 2l-7 7-3-3 7-7 3 3z"></path></svg>
        </button>
        <button class="wb-tool-btn" data-tool="eraser" title="Eraser">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
        </button>
        <button class="wb-tool-btn" data-tool="line" title="Line">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
        </button>
        <button class="wb-tool-btn" data-tool="rectangle" title="Rectangle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        </button>
        <button class="wb-tool-btn" data-tool="ellipse" title="Ellipse">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
        </button>
        <button class="wb-tool-btn" data-tool="arrow" title="Arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <button class="wb-tool-btn" data-tool="text" title="Text">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
        </button>
        <button class="wb-tool-btn" data-tool="pan" title="Pan Board">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
        </button>
      </div>

      <!-- Color & Stroke Palette Dock -->
      <div class="whiteboard-palette-dock">
        <div style="display: flex; gap: 8px;">
          <div class="color-swatch active" data-color="#111111" style="background-color: #111111;"></div>
          <div class="color-swatch" data-color="#2563EB" style="background-color: #2563EB;"></div>
          <div class="color-swatch" data-color="#16A34A" style="background-color: #16A34A;"></div>
          <div class="color-swatch" data-color="#DC2626" style="background-color: #DC2626;"></div>
          <div class="color-swatch" data-color="#F59E0B" style="background-color: #F59E0B;"></div>
          <div class="color-swatch" data-color="#9333EA" style="background-color: #9333EA;"></div>
          <div class="color-swatch" data-color="#FFFFFF" style="background-color: #FFFFFF; border: 1px solid #D4D4D8;"></div>
        </div>

        <div style="width: 1px; height: 20px; background-color: var(--border-color);"></div>

        <div style="display: flex; gap: 6px;">
          <button class="stroke-width-btn" data-width="2">Thin</button>
          <button class="stroke-width-btn active" data-width="4">Med</button>
          <button class="stroke-width-btn" data-width="8">Bold</button>
          <button class="stroke-width-btn" data-width="16">Thick</button>
        </div>
      </div>

      <div class="canvas-viewport">
        <canvas id="whiteboard-canvas"></canvas>
      </div>
    </div>

    <!-- Side Panel (Chat, Files, Participants) -->
    <aside class="side-panel" id="side-panel">
      <div class="panel-header">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="tab-chat" id="tab-btn-chat">Chat</button>
          <button class="panel-tab" data-tab="tab-files" id="tab-btn-files">Files</button>
          <button class="panel-tab" data-tab="tab-people" id="tab-btn-people">People</button>
        </div>
        <button class="tile-icon-btn" id="btn-close-panel" title="Close Panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="panel-content">
        <!-- 1. CHAT PANE -->
        <div class="panel-pane active" id="pane-chat">
          <div style="padding: 10px 16px; border-bottom: 1px solid #26262A; font-size: var(--font-size-xs); color: #16A34A; display: flex; align-items: center; gap: 6px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span>End-to-End Encrypted (AES-256-GCM)</span>
          </div>

          <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <!-- Rendered chat messages -->
          </div>

          <form id="form-chat" style="padding: 12px 16px; border-top: 1px solid #26262A; display: flex; gap: 8px;">
            <input type="text" id="input-chat" placeholder="Type an encrypted message..." autocomplete="off" style="flex: 1; background-color: #1E1E22; border-color: #2F2F35; color: #F4F4F5;" required>
            <button type="submit" id="btn-send-chat" class="btn btn-primary" style="padding: 8px 12px;">Send</button>
          </form>
        </div>

        <!-- 2. FILES PANE -->
        <div class="panel-pane" id="pane-files">
          <div style="padding: 16px; border-bottom: 1px solid #26262A;">
            <div style="font-size: var(--font-size-meta); font-weight: 500; margin-bottom: 8px;">Share a File</div>
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
              <button id="btn-mode-p2p" class="btn btn-secondary" style="flex: 1; padding: 4px 8px; font-size: var(--font-size-xs); background-color: #2563EB; border-color: #2563EB; color: #FFFFFF;">Direct P2P</button>
              <button id="btn-mode-server" class="btn btn-secondary" style="flex: 1; padding: 4px 8px; font-size: var(--font-size-xs); background-color: #1E1E22; border-color: #2F2F35; color: #F4F4F5;">Encrypted Server</button>
            </div>
            
            <input type="file" id="file-input" style="display: none;">
            <button id="btn-select-file" class="btn btn-secondary" style="width: 100%; border-style: dashed; padding: 12px; background-color: #1E1E22; border-color: #2F2F35; color: #F4F4F5;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span>Choose File (Max 100MB)</span>
            </button>

            <!-- Active File Progress -->
            <div id="file-progress-container" style="display: none; margin-top: 12px;">
              <div style="display: flex; justify-content: space-between; font-size: var(--font-size-xs); margin-bottom: 4px;">
                <span id="file-progress-name">Uploading...</span>
                <span id="file-progress-percent">0%</span>
              </div>
              <div style="height: 6px; background-color: #27272A; border-radius: 3px; overflow: hidden; margin-bottom: 6px;">
                <div id="file-progress-bar" style="height: 100%; width: 0%; background-color: var(--accent); transition: width 60ms linear;"></div>
              </div>
              <button id="btn-cancel-file" class="btn btn-secondary" style="padding: 2px 8px; font-size: var(--font-size-xs); color: var(--danger);">Cancel Transfer</button>
            </div>
          </div>

          <div style="flex: 1; overflow-y: auto; padding: 16px;">
            <div style="font-size: var(--font-size-xs); font-weight: 600; text-transform: uppercase; color: #71717A; margin-bottom: 8px;">Shared Files</div>
            <div id="files-list" style="display: flex; flex-direction: column; gap: 8px;">
              <!-- Dynamic file items -->
            </div>
          </div>
        </div>

        <!-- 3. PEOPLE PANE -->
        <div class="panel-pane" id="pane-people">
          <div style="padding: 12px 16px; border-bottom: 1px solid #26262A; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 500; font-size: var(--font-size-meta);" id="people-panel-count">1 Participant</span>
            
            <!-- Host Lock Meeting Button -->
            <button id="btn-host-lock" class="btn btn-secondary" style="display: none; padding: 4px 8px; font-size: var(--font-size-xs); background-color: #1E1E22; border-color: #2F2F35; color: #F4F4F5;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <span id="host-lock-text">Lock Room</span>
            </button>
          </div>

          <div id="people-list" style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
            <!-- Participants list -->
          </div>

          <div id="host-actions-dock" style="display: none; padding: 12px 16px; border-top: 1px solid #26262A;">
            <button id="btn-host-end-all" class="btn btn-danger" style="width: 100%; font-size: var(--font-size-meta);">End Meeting for Everyone</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <!-- Bottom Control Dock -->
  <footer class="call-controls">
    <div class="control-group">
      <div style="font-size: var(--font-size-meta); font-family: monospace; color: #A1A1AA;" id="call-timer">00:00</div>
    </div>

    <!-- Center Essential Controls -->
    <div class="control-group">
      <!-- Microphone Toggle (M) -->
      <button class="dock-btn" id="btn-dock-mic" title="Toggle microphone (M)" aria-label="Toggle microphone">
        <svg id="dock-icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Camera Toggle (V) -->
      <button class="dock-btn" id="btn-dock-cam" title="Toggle camera (V)" aria-label="Toggle camera">
        <svg id="dock-icon-cam" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </button>

      <!-- Share Screen Toggle (S) -->
      <button class="dock-btn" id="btn-dock-share" title="Share screen (S)" aria-label="Share screen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </button>

      <!-- Whiteboard Toggle (W) -->
      <button class="dock-btn" id="btn-dock-whiteboard" title="Collaborative whiteboard (W)" aria-label="Whiteboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        </svg>
      </button>

      <!-- Raise Hand -->
      <button class="dock-btn" id="btn-dock-hand" title="Raise hand" aria-label="Raise hand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
        </svg>
      </button>

      <!-- Leave Call Button -->
      <button class="dock-btn dock-btn-danger" id="btn-dock-leave" title="Leave meeting" aria-label="Leave meeting">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M13.8 12H3"></path>
          <path d="M16 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
        </svg>
        <span>Leave</span>
      </button>
    </div>

    <!-- Right Auxiliary Dock Items -->
    <div class="control-group">
      <button class="dock-btn" id="btn-dock-chat" title="Chat" aria-label="Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="unread-badge" id="chat-unread-count" style="display: none;">0</span>
      </button>

      <button class="dock-btn" id="btn-dock-files" title="Files" aria-label="Files">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </button>

      <button class="dock-btn" id="btn-dock-people" title="Participants" aria-label="Participants">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </button>
    </div>
  </footer>

  <!-- Confirmation Dialog (Leave / End) -->
  <div class="modal-overlay" id="modal-confirm-leave">
    <div class="modal-content" style="background-color: #18181B; border-color: #27272A; color: #F4F4F5;">
      <div class="modal-header">
        <h2>Leave Meeting</h2>
        <button class="btn-icon" id="btn-close-leave-modal" aria-label="Close dialog" style="color: #F4F4F5; border-color: #27272A;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p style="color: #A1A1AA; margin-bottom: 20px;">Are you sure you want to disconnect from this call?</p>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancel-leave" style="background-color: #27272A; border-color: #3F3F46; color: #F4F4F5;">Cancel</button>
        <button class="btn btn-danger" id="btn-confirm-leave">Leave</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <!-- Entry Script -->
  <script type="module" src="/js/room-app.js"></script>
</body>
</html>
